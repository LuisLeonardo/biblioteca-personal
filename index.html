<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca personal</title>

    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>

<body>

    <header class="encabezado">
        <h1>Biblioteca</h1>
        <p>Mi colección personal de lecturas</p>
    </header>


    <nav class="navegacion">

        <button
            class="nav-btn activo"
            data-vista="coleccion">
            Colección
        </button>

        <button
            class="nav-btn"
            data-vista="leidos">
            Leídos
        </button>

        <button
            class="nav-btn"
            data-vista="radar">
            Radar académico
        </button>

        <button
            class="nav-btn"
            data-vista="seleccionadas">
            Novedades Seleccionadas
        </button>

        <button
            class="nav-btn"
            data-vista="agregar">
            Agregar
        </button>

    </nav>


    <main class="contenedor">


        <!-- ==================================================
             COLECCIÓN
        ================================================== -->

        <section
            id="vista-coleccion"
            class="vista activa">

            <h2>Mi colección</h2>

            <input
                type="search"
                id="busqueda"
                placeholder="Buscar por título o autor..."
            >

            <select id="filtro-disciplina">

                <option value="todas">
                    Todas las disciplinas
                </option>

                <option value="economia">
                    Economía
                </option>

                <option value="matematicas">
                    Matemáticas
                </option>

                <option value="otros">
                    Otros
                </option>

            </select>

            <div
                id="lista-coleccion"
                class="lista-materiales">
            </div>

        </section>


        <!-- ==================================================
             LEÍDOS
        ================================================== -->

        <section
            id="vista-leidos"
            class="vista">

            <h2>Materiales leídos</h2>

            <div
                id="lista-leidos"
                class="lista-materiales">
            </div>

        </section>


        <!-- ==================================================
             RADAR ACADÉMICO
        ================================================== -->

        <section
            id="vista-radar"
            class="vista">

            <div class="radar-encabezado">

                <div>
                    <h2>Radar académico</h2>

                    <p>
                        Novedades académicas recientes de las
                        fuentes seleccionadas.
                    </p>
                </div>

                <button
                    id="btn-actualizar-radar"
                    type="button">
                    Actualizar radar
                </button>

            </div>


            <div
                id="estado-radar"
                class="estado-radar"
                aria-live="polite">
            </div>


            <div class="radar-filtros">

                <select id="filtro-radar-fuente">

                    <option value="todas">
                        Todas las fuentes
                    </option>

                </select>


                <select id="filtro-radar-categoria">

                    <option value="todas">
                        Todas las categorías
                    </option>

                </select>


                <label class="checkbox-radar">

                    <input
                        type="checkbox"
                        id="filtro-radar-oa"
                    >

                    Solo acceso abierto

                </label>

            </div>


            <div
                id="lista-radar"
                class="lista-materiales">
            </div>

        </section>


        <!-- ==================================================
             NOVEDADES SELECCIONADAS
        ================================================== -->

        <section
            id="vista-seleccionadas"
            class="vista">

            <div class="radar-encabezado">

                <div>

                    <h2>Novedades Seleccionadas</h2>

                    <p>
                        Materiales que decidiste conservar
                        desde el Radar académico.
                    </p>

                </div>

            </div>


            <div
                id="lista-seleccionadas"
                class="lista-materiales">
            </div>

        </section>


        <!-- ==================================================
             AGREGAR MATERIAL
        ================================================== -->

        <section
            id="vista-agregar"
            class="vista">

            <h2>Agregar material</h2>

            <form id="form-material">

                <label for="disciplina">
                    Disciplina
                </label>

                <select
                    id="disciplina"
                    required>

                    <option value="">
                        Selecciona una disciplina
                    </option>

                    <option value="economia">
                        Economía
                    </option>

                    <option value="matematicas">
                        Matemáticas
                    </option>

                    <option value="otros">
                        Otros
                    </option>

                </select>


                <label for="titulo">
                    Título
                </label>

                <input
                    type="text"
                    id="titulo"
                    required
                >


                <label for="autores">
                    Autor o autores
                </label>

                <textarea
                    id="autores"
                    placeholder="Escribe un autor por línea"
                    required>
                </textarea>


                <label for="editorial">
                    Editorial
                </label>

                <input
                    type="text"
                    id="editorial"
                >


                <label for="anio">
                    Año
                </label>

                <input
                    type="number"
                    id="anio"
                    min="1"
                    max="2100"
                >


                <label for="tipo">
                    Tipo de material
                </label>

                <select
                    id="tipo"
                    required>

                    <option value="">
                        Selecciona una opción
                    </option>

                    <option value="fisico">
                        Físico
                    </option>

                    <option value="digital">
                        Digital
                    </option>

                </select>


                <label for="link-drive">
                    Enlace de Google Drive
                </label>

                <input
                    type="url"
                    id="link-drive"
                    placeholder="https://drive.google.com/..."
                >


                <button
                    type="submit"
                    id="btn-guardar">
                    Guardar material
                </button>


                <p
                    id="mensaje-formulario"
                    aria-live="polite">
                </p>

            </form>

        </section>

    </main>


    <footer class="pie">

        <p>
            Biblioteca personal
        </p>

    </footer>

</body>
</html>
